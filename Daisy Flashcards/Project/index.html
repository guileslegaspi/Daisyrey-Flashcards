<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Study Hub</title>
    <link rel="stylesheet" href="review.css">
</head>
<body>

    <h1>Accounting Study Hub</h1>

    <div class="dashboard">
        
        <!-- LEFT COLUMN: The Creator Form -->
        <div class="form-container">
            <h2>＋ Add New Flashcard</h2>
            <form id="card-form">
                <div class="form-group">
                    <label for="form-category">Category</label>
                    <input type="text" id="form-category" placeholder="e.g., Audit, Tax, GAAP" required>
                </div>
                <div class="form-group">
                    <label for="form-question">Question / Term</label>
                    <textarea id="form-question" placeholder="Enter the concept..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="form-answer">Answer / Definition</label>
                    <input type="text" id="form-answer" placeholder="e.g., Assets = Liabilities + Equity" required>
                </div>
                <div class="form-group">
                    <label for="form-explanation">Explanation / Context</label>
                    <textarea id="form-explanation" placeholder="Why is this true? Add examples..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Save to Deck</button>
            </form>
        </div>

        <!-- RIGHT COLUMN: The Active Card Player -->
        <div class="viewer-container">
            <span id="category" class="category-tag">Category</span>
            
            <div class="card-container" id="flashcard-click-area">
                <div class="card-inner" id="card-inner-element">
                    <div class="card-front">
                        <p id="question-text">Loading...</p>
                    </div>
                    <div class="card-back">
                        <div class="back-content">
                            <strong class="answer-title">Answer:</strong>
                            <p id="answer-text">Loading...</p>
                            <hr class="card-divider">
                            <strong class="explanation-title">Explanation:</strong>
                            <p id="explanation-text" class="explanation-paragraph">Loading...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="flip-btn">Flip</button>
                <button id="next-btn">Next →</button>
            </div>
            
            <div id="counter" class="counter-text">Card 0 of 0</div>
        </div>

    </div>

    <script src="review.js"></script>
</body>
</html>
